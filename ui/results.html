<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Checkup · Problems found</title>
<script src="state.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  header.top { display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: end; padding: 56px 0 32px; border-bottom: 1px solid var(--line); }
  .count-big { font-family: var(--mono); color: var(--danger); }
  .summary { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text-2); }
  .chip i { width: 7px; height: 7px; border-radius: 50%; }
  .chip.urgent i { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .chip.soon i { background: var(--warn); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 0; flex-wrap: wrap; }
  .filters { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .filters button { background: none; border: 0; border-right: 1px solid var(--line); color: var(--text-3); font: inherit; font-size: 13px; padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .filters button:last-child { border-right: 0; }
  .filters button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }
  .filters button:hover { color: var(--text); }
  .filters .n { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  .progress { font-family: var(--mono); font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 10px; }
  .progress .track { width: 120px; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress .track i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }

  .list { display: grid; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; position: relative; overflow: hidden; transition: opacity .3s, border-color .3s; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; }
  .card.urgent::before { background: var(--danger); box-shadow: 0 0 12px var(--danger); }
  .card.soon::before { background: var(--warn); }
  .card-head { display: grid; grid-template-columns: 40px 1fr auto; gap: 16px; padding: 20px 24px; align-items: start; }
  .card .box { width: 40px; height: 40px; border: 1px solid var(--line-strong); border-radius: 6px; display: grid; place-items: center; }
  .card.urgent .box { color: var(--danger); border-color: rgba(255,77,77,.35); background: var(--danger-bg); }
  .card.soon .box { color: var(--warn); border-color: rgba(245,166,35,.35); background: var(--warn-bg); }
  .sev { font-family: var(--mono); font-size: 11px; letter-spacing: .071em; text-transform: uppercase; margin-bottom: 6px; }
  .urgent .sev { color: var(--danger); }
  .soon .sev { color: var(--warn); }
  .sev span { color: var(--text-3); }
  .card h2 { margin-bottom: 6px; }
  .detail { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
  .detail b { color: var(--text-2); font-weight: 400; }
  .done-btn { background: none; border: 1px solid var(--line-strong); color: var(--text-2); font: inherit; font-size: 13px; height: 32px; padding: 0 12px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .done-btn:hover { color: var(--text); border-color: #4a4a4a; }

  .card-body { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
  .col { padding: 20px 24px; }
  .col + .col { border-left: 1px solid var(--line); background: #070707; }
  .col h3 { font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .071em; text-transform: uppercase; color: var(--text-3); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .col ol { padding-left: 18px; color: var(--text); display: grid; gap: 6px; margin-bottom: 16px; }
  .col ol li::marker { font-family: var(--mono); color: var(--text-3); font-size: 12px; }
  .col p { color: var(--text-2); }
  .col p + p { margin-top: 8px; }

  .card.fixed { opacity: .45; }
  .card.fixed::before { background: var(--ok); box-shadow: none; }
  .card.fixed .done-btn { color: var(--ok); border-color: rgba(69,165,87,.4); }
  .card.fixed .card-body { display: none; }
  .card.fixed h2 { text-decoration: line-through; text-decoration-color: var(--text-3); }

  .foot-note { font-family: var(--mono); font-size: 12px; color: var(--text-3); border-top: 1px solid var(--line); padding: 20px 0 0; margin-top: 8px; display: flex; gap: 24px; flex-wrap: wrap; }
  .foot-note span::before { content: "✓ "; color: var(--ok); }

  @media (max-width: 860px) {
    header.top { grid-template-columns: 1fr; padding-top: 32px; }
    .card-head { grid-template-columns: 1fr; }
    .card .box { display: none; }
    .card-body { grid-template-columns: 1fr; }
    .col + .col { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="connect.html"><span class="mark" aria-hidden="true"></span>Privacy Checkup</a>
    <div class="account"><span class="avatar">A</span>aarav@gmail.com</div>
  </nav>

  <header class="top">
    <div>
      <p class="eyebrow" id="when">Check complete · just now</p>
      <h1 id="headline"><span class="count-big" id="left">0</span> <span id="headWord">problems need your attention.</span></h1>
      <p class="lede">Start with the urgent ones. Each has a quick fix, and a habit to keep it from happening again.</p>
    </div>
    <div class="summary" id="summary"></div>
  </header>

  <div class="toolbar">
    <div class="filters" role="group" aria-label="Filter problems" id="filters"></div>
    <div class="progress"><span id="fixedTxt"></span><span class="track"><i id="fixedBar"></i></span></div>
  </div>

  <div class="list" id="list"></div>
  <div class="foot-note" id="foot"></div>
  <div style="display:flex;gap:10px;margin:24px 0 120px;flex-wrap:wrap">
    <a class="btn btn-ghost btn-sm" href="scanning.html">Run the check again</a>
    <a class="btn btn-ghost btn-sm" href="account.html#checks">Change what we check</a>
  </div>
</div>

<script>
  const st = PC.get(), T = PC.totals();
  const problems = PC.problems();
  const icons = {
    leaks: '<path d="M12 2.8l7.5 3v5.7c0 4.6-3.2 8.3-7.5 9.7-4.3-1.4-7.5-5.1-7.5-9.7V5.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 8v4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="15.6" r="1" fill="currentColor"/>',
    files: '<path d="M8.5 3h7l6 10.5-3.5 6H6l-3.5-6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 3l6 10.5H21M15.5 3L9.3 13.5 6 19.5M2.5 13.5h12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
    email: '<rect x="2.5" y="5" width="19" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 6.5l9 7 9-7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
  };
  const catName = { leaks: 'Email leak', files: 'Files', email: 'Email' };

  document.getElementById('list').innerHTML = problems.map(p => `
    <article class="card ${p.sev}" data-cat="${p.cat}" data-id="${p.id}">
      <div class="card-head">
        <span class="box"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${icons[p.cat]}</svg></span>
        <div>
          <p class="sev">${p.sev === 'urgent' ? 'Urgent' : 'Check soon'} <span>· ${catName[p.cat]}</span></p>
          <h2>${p.title}</h2>
          <p class="detail">${p.detail}</p>
        </div>
        <button class="done-btn" type="button">Mark as fixed</button>
      </div>
      <div class="card-body">
        <div class="col">
          <h3>Fix it now</h3>
          <ol>${p.fix.map(x => '<li>' + x + '</li>').join('')}</ol>
          ${p.link ? `<a class="btn btn-primary btn-sm" href="${p.link.href}" target="_blank" rel="noopener">${p.link.label} ↗</a>` : ''}
        </div>
        <div class="col">
          <h3>Avoid it next time</h3>
          ${p.avoid.map(x => '<p>' + x + '</p>').join('')}
        </div>
      </div>
    </article>`).join('');

  const cats = [['all', 'All'], ['files', 'Files'], ['email', 'Email'], ['leaks', 'Email leaks']]
    .filter(([k]) => k === 'all' || st.settings[k]);
  document.getElementById('filters').innerHTML = cats.map(([k, t], i) =>
    `<button aria-pressed="${i === 0}" data-f="${k}">${t} <span class="n">${k === 'all' ? problems.length : problems.filter(p => p.cat === k).length}</span></button>`).join('');

  const urgent = problems.filter(p => p.sev === 'urgent').length;
  document.getElementById('summary').innerHTML =
    (urgent ? `<span class="chip urgent"><i></i>${urgent} urgent</span>` : '') +
    (problems.length - urgent ? `<span class="chip soon"><i></i>${problems.length - urgent} check soon</span>` : '');

  const foot = [];
  if (T.files) foot.push(`<span>${T.files} files checked</span>`);
  if (T.emails) foot.push(`<span>${T.emails} security emails reviewed</span>`);
  if (T.leaks) foot.push(`<span>${T.leaks}+ known leaks searched</span>`);
  document.getElementById('foot').innerHTML = foot.join('');

  const cards = [...document.querySelectorAll('.card')];
  const paint = (c, on) => { c.classList.toggle('fixed', on); c.querySelector('.done-btn').textContent = on ? '✓ Fixed · undo' : 'Mark as fixed'; };
  cards.forEach(c => paint(c, PC.fixed().includes(c.dataset.id)));

  const update = (fromClick) => {
    const fixed = cards.filter(c => c.classList.contains('fixed')).length, left = cards.length - fixed;
    document.getElementById('left').textContent = left;
    document.getElementById('headWord').textContent = left === 1 ? 'problem needs your attention.' : 'problems need your attention.';
    document.getElementById('fixedTxt').textContent = fixed + ' of ' + cards.length + ' fixed';
    document.getElementById('fixedBar').style.width = (cards.length ? fixed / cards.length * 100 : 100) + '%';
    if (left === 0 && fromClick) setTimeout(() => location.href = 'clear.html?fixed=' + cards.length, 700);
  };
  cards.forEach(c => c.querySelector('.done-btn').addEventListener('click', () => {
    const on = !c.classList.contains('fixed');
    paint(c, on);
    PC.setFixed(on ? [...new Set([...PC.fixed(), c.dataset.id])] : PC.fixed().filter(id => id !== c.dataset.id));
    if (on) toast('Marked as fixed. Nice.');
    update(true);
  }));
  document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === b));
    cards.forEach(c => c.hidden = b.dataset.f !== 'all' && c.dataset.cat !== b.dataset.f);
  }));

  // Nothing to show at all: go straight to the all-clear screen.
  if (!cards.length) location.replace('clear.html');
  else if (cards.every(c => c.classList.contains('fixed'))) {
    document.getElementById('when').textContent = 'Last check · everything fixed';
  }
  update(false);
</script>
<script src="shared.js"></script>
</body>
</html>
